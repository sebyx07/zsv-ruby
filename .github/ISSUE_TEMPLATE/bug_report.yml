name: Bug report
description: A wrong row, an error, a crash, or a build / install failure.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are triaged by an AI maintainer. It can only act on a report it can reproduce, so every field below is required.

        A crash on crafted input or any other memory-safety problem? Do not file it here: follow [SECURITY.md](https://github.com/sebyx07/zsv-ruby/blob/main/SECURITY.md).
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest CSV input and the exact call with its options. Paste the input as a Ruby string literal (so quotes, `\r\n` and a missing final newline survive), or attach the file.
      placeholder: |
        require 'zsv'
        ZSV.parse("a,b\n1,\"x\ny\"\n", headers: true)
      render: ruby
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: The rows you expected. If Ruby's CSV gives them, show that call and its output.
      placeholder: |
        CSV.parse("a,b\n1,\"x\ny\"\n", headers: true).map(&:to_h)
        # => [{"a"=>"1", "b"=>"x\ny"}]
      render: ruby
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: The rows you got, or the full error. For a crash, the whole "[BUG]" report including the C level backtrace. For an install failure, the contents of mkmf.log.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: zsv gem version
      description: "Output of: gem list zsv (include the platform suffix if there is one, e.g. x86_64-linux)"
      placeholder: "x.y.z"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "ruby -v, OS and version, CPU architecture, C compiler (cc --version) if the gem was compiled on install"
      placeholder: "ruby 3.4.x (arm64-darwin24), macOS 15, Apple clang 16"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Wrong rows / differs from Ruby's CSV
        - Exception raised
        - Crash (segfault, abort) or hang
        - Memory growth / leak
        - Install or compile failure
        - Something else
    validations:
      required: true
