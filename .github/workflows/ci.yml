name: CI

# The gate for every pull request and every push to main. Branch protection
# requires only the aggregate "CI OK" job, so jobs can be added or renamed here
# without touching the ruleset. release.yml calls this workflow (workflow_call)
# to verify a version before it is published.
#
# Local equivalent: `bin/check` (repo guards, RuboCop, clang-format, compile,
# RSpec), which the "Gate" job runs unchanged; bin/repo-guards fails if this
# file stops running it. The other jobs add what one Linux box cannot: every
# Ruby x OS/arch, ASan/UBSan, and the packaged gem installing offline.
#
# Ruby floor: gemspec required_ruby_version (3.3; 3.2 reached EOL 2026-03).
# Ruby head and zsv upstream (main + latest release) run monthly in canary.yml,
# the precompiled platform gems in native-gems.yml (release + canary), and
# benchmarks in benchmark.yml; none of them is part of "CI OK".
#
# Cost shape: a change that touches only prose (`*.md`, `docs/`) skips the
# compile/test jobs (the `changes` job decides; "CI OK" still reports). A pull
# request runs the floor and the newest Ruby on Linux x86_64 + arm64; the full
# Ruby x OS matrix, macOS included, runs on every push to main that is not
# docs-only, on a manual run and when release.yml calls this workflow.
#
# Windows is not in the matrix: extconf.rb builds the vendored zsv with its
# POSIX shell `./configure` + `make` through Kernel#system, which cannot run a
# shell script under RubyInstaller. Adding Windows means building libzsv through
# mkmf (or the MSYS2 shell) first, then adding windows-latest here.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: '1'

jobs:
  # Decides whether the change needs a compiler. Anything it cannot read
  # (first push, API error, a truncated file list) counts as code.
  changes:
    name: Changes / code or docs only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          # The commits this run tests: the base and the commit that is checked out (for a pull
          # request that is the merge commit, so a file main moved is seen where it lands).
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          code=true
          # "<files> <paths outside the docs filter>"; a rename counts under its old and its
          # new name, and the filter tests whole paths (prefix or suffix, no line anchors). The compare API lists at most 300 files: 300 means "truncated".
          # shellcheck disable=SC2016  # $paths is a jq variable, not a shell one
          counts=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '
            [.files[] | .filename, (.previous_filename // empty)] as $paths
            | "\(.files | length) \($paths | map(select((endswith(".md") or startswith("docs/")) | not)) | length)"') || counts=''
          read -r files other <<<"$counts" || true
          if [ -n "$files" ] && [ "$files" -gt 0 ] && [ "$files" -lt 300 ] && [ "$other" = 0 ]; then
            code=false
          fi
          echo "files changed: ${files:-unreadable}, outside the docs filter: ${other:-unreadable}"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  workflows:
    name: Lint / workflows + repo guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: zizmor (workflow security)
        run: pipx run zizmor==1.33.1 --format=github .github/workflows
      # CI/bin/check parity, the agent-read surface, the CLAUDE.md size cap,
      # gem/zsv version sync. bin/check runs it too; here it needs no Ruby.
      - name: Repository guards
        run: bin/repo-guards

  check:
    name: Gate / bin/check (Ruby .ruby-version, Linux x86_64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # A missing clang-format is exit 75 here, never "not graded".
      ZSV_REQUIRE_CLANG_FORMAT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: clang-format
        run: command -v clang-format || { sudo apt-get update -qq && sudo apt-get install -y -qq clang-format; }
      # The local gate, unchanged: repo guards, RuboCop, clang-format, compile, RSpec.
      - name: bin/check
        run: bin/check

  test:
    name: Test / Ruby ${{ matrix.ruby }} · ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04: x86_64 (SSE/AVX), ubuntu-24.04-arm and macos-latest:
        # arm64 (NEON), macos-15-intel: x86_64 Darwin.
        # The second list of each pair is the supported set; a pull request
        # runs the first (see "Cost shape" above).
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04", "ubuntu-24.04-arm"]' || '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-latest", "macos-15-intel"]') }}
        ruby: ${{ fromJSON(github.event_name == 'pull_request' && '["3.3", "4.0"]' || '["3.3", "3.4", "4.0"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # Lint and guards are platform-independent and graded once, in the gate job.
      - name: Compile the extension
        run: bundle exec rake compile
      - name: RSpec
        run: bundle exec rspec

  sanitizers:
    name: Test / ASan + UBSan (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      # Clean ASan + UBSan rebuild, the instrumentation check, RSpec with the
      # sanitizer runtimes preloaded, then the normal build restored: the same
      # recipe agents run locally before a C change.
      - name: bin/check asan
        run: bin/check asan

  package:
    name: Package / build + offline install + require
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build the source gem
        run: bundle exec rake build
      # The zsv C sources ship inside the gem, so `gem install` must compile it
      # with no network at all: a fresh network namespace has no interface up.
      - name: Install it into an empty GEM_HOME with the network disabled, require, parse
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if unshare -rn curl -sS --max-time 5 https://rubygems.org >/dev/null 2>&1; then
            echo "::error::The network namespace still reaches rubygems.org; the offline check would prove nothing."
            exit 1
          fi
          unshare -rn ruby .github/scripts/gem-smoke.rb pkg/zsv-*.gem

  ci-ok:
    name: CI OK
    if: always()
    # Every job above must succeed; cancelled counts as failed, and so does
    # skipped unless the change is docs-only (changes.outputs.code == 'false').
    needs: [changes, workflows, check, test, sanitizers, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "Results: $RESULTS (code change: $CODE)"
          for r in $RESULTS; do
            if [ "$r" = skipped ] && [ "$CODE" = false ]; then continue; fi
            if [ "$r" != success ]; then
              echo "::error::A required job finished with '$r'. Open the failed job above: its step names the check, and the same command reproduces it locally."
              exit 1
            fi
          done
